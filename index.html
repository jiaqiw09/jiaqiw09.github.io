<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="infra杂谈，涵盖大模型训练、GPU 通信和系统实现。">
  <meta name="theme-color" content="#fafaf8">
  <title>infra杂谈</title>
  <link rel="stylesheet" href="./assets/reader.css">
</head>
<body class="reader-home">
  <header class="reader-header">
    <div class="reader-header-inner">
      <a class="site-name" href="./">infra杂谈</a>
    </div>
  </header>
  <div class="reader-layout">
    <details class="reader-sidebar" open>
      <summary class="reader-toggle">目录</summary>
      <nav class="catalog" aria-label="文件目录">
        <h1>目录</h1>
        <details open>
          <summary>模型基础</summary>
          <details class="branch" open>
            <summary>注意力</summary>
            <ul class="branch">
              <li><a href="./notes/attention-from-matrices/" data-chapter="attention-from-matrices" target="chapter-content">从矩阵到注意力</a></li>
            </ul>
          </details>
        </details>
        <details open>
          <summary>GPU 通信</summary>
          <details class="branch" open>
            <summary>多卡互联</summary>
            <ul class="branch">
              <li><a href="./notes/gpu-rdma/" data-chapter="gpu-rdma" target="chapter-content" aria-current="page">GPU 多卡互联与 RDMA</a></li>
            </ul>
          </details>
        </details>
        <details open>
          <summary>分布式训练</summary>
          <details class="branch" open>
            <summary>并行策略</summary>
            <ul class="branch">
              <li><a href="./notes/ulysses-sp/" data-chapter="ulysses-sp" target="chapter-content">Ulysses 序列并行（SP）</a></li>
              <li><a href="./notes/fsdp2-ep/" data-chapter="fsdp2-ep" target="chapter-content">FSDP2 + EP 端到端数据流</a></li>
            </ul>
          </details>
        </details>
      </nav>
    </details>
    <main class="reader-pane" aria-label="文件内容">
      <iframe src="./notes/gpu-rdma/" name="chapter-content" title="GPU 多卡互联与 RDMA"></iframe>
    </main>
  </div>
  <script>
    const chapterLinks = [...document.querySelectorAll(".catalog a[data-chapter]")];
    const frame = document.querySelector('iframe[name="chapter-content"]');
    const sidebar = document.querySelector(".reader-sidebar");
    const compact = matchMedia("(max-width: 890px)");
    let displayedUrl = frame.src;
    const resize = new ResizeObserver(() => {
      const body = frame.contentDocument?.body;
      if (body) {
        frame.style.height = Math.ceil(body.getBoundingClientRect().height) + "px";
      }
    });

    frame.addEventListener("load", () => {
      resize.disconnect();
      const body = frame.contentDocument?.body;
      if (body) {
        resize.observe(body);
      }
    });

    function syncSidebar() {
      sidebar.open = !compact.matches;
    }

    function showChapter() {
      const requested = new URLSearchParams(location.search).get("chapter");
      const selected = chapterLinks.find(link => link.dataset.chapter === requested) ?? chapterLinks[0];
      for (const link of chapterLinks) {
        if (link === selected) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      }
      frame.title = selected.textContent.trim();
      if (displayedUrl !== selected.href) {
        displayedUrl = selected.href;
        frame.contentWindow.location.replace(displayedUrl);
      }
    }

    for (const link of chapterLinks) {
      link.addEventListener("click", event => {
        if (event.button !== 0 || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) {
          return;
        }
        event.preventDefault();
        const url = new URL(location.href);
        if (url.searchParams.get("chapter") !== link.dataset.chapter) {
          url.searchParams.set("chapter", link.dataset.chapter);
          history.pushState(null, "", url);
        }
        showChapter();
        if (compact.matches) {
          sidebar.open = false;
        }
        window.scrollTo(0, 0);
      });
    }
    compact.addEventListener("change", syncSidebar);
    window.addEventListener("popstate", showChapter);
    syncSidebar();
    showChapter();
  </script>
</body>
</html>
